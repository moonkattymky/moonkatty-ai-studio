<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><link rel="icon" href="/logo.svg"><title>MOONKATTY · Mobile Control</title>
<style>
:root{color-scheme:dark;--bg:#0b0d1a;--card:#161a2e;--mut:#8b90b0;--ok:#3ecf8e;--err:#ff6b6b;--warn:#f5b041;--acc:#8b7cff}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:#e8e9f3;padding:env(safe-area-inset-top) 12px 80px}
h1{font-size:18px;margin:14px 0}h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
button{background:#262b4a;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:14px}button.p{background:var(--acc)}button.d{background:#5a2330}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #333a60;background:#0f1224;color:#fff;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10132a;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}nav button{flex:1;background:none}
nav button.on{color:var(--acc)}pre{white-space:pre-wrap;font-size:13px;max-height:200px;overflow:auto}img,video{max-width:100%;border-radius:8px}
</style></head>
<body>
<h1>🌙 MOONKATTY · Mobile Control</h1>
<div id="login" hidden class="card"><p>Вставьте мобильный токен (создаётся в панели на Mac: <code>POST /api/ops/mobile-tokens</code>, см. docs/ops/MOBILE.md).</p>
<input id="tok" type="password" autocomplete="off" placeholder="mkm_…"><p><button class="p" id="save">Войти</button></p></div>
<main id="app" hidden></main>
<nav id="nav" hidden><button data-v="summary" class="on">Обзор</button><button data-v="tasks">Задачи</button><button data-v="materials">Материалы</button><button data-v="media">Медиа</button><button data-v="alerts">Уведомл.</button></nav>
<script src="/mobile.js"></script>
</body></html>
